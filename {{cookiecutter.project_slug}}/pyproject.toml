[project]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
description = "Translation of IDs found in {{cookiecutter.organization}} databases."
authors = [
    { name = "{{cookiecutter.full_name}}", email = "{{cookiecutter.email}}" },
]
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    "id-translation[fetching] {{cookiecutter.id_translation_version}}",
]


[project.entry-points."id_translation.dio"]
# See https://id-translation.readthedocs.io/en/stable/documentation/translation-io.html#user-defined-integrations
# name_doesnt_matter = "{{cookiecutter.namespace}}.id_translation.submodule:MyDataStructureIO"


[dependency-groups]
test = [
    "pytest~=9.0.2",
    "mypy~=1.19.1",
    "ruff~=0.15.5",
    # Demo dependencies
    "pg8000 ~= 1.31.5"  # src/{{cookiecutter.namespace}}/id_translation/config/fetching/dvd-rental-store.toml
    # "s3fs ~= 2025.9.0",  # src/{{cookiecutter.namespace}}/id_translation/config/fetching/inactive/csv-files-in-s3.toml
]
docs = [
    "sphinx~=8.2.3",
    "pydata-sphinx-theme~=0.16.1",
]
types = [
    "pandas-stubs",
    "types-greenlet",
    "scipy-stubs",
    "types-openpyxl",
    "types-python-dateutil",
    "types-xlrd",
    "types-Pygments",
    "types-pexpect",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "{{cookiecutter.namespace}}.id_translation"

[tool.pytest.ini_options]
filterwarnings = []
markers = ["no_database: does not need the Sakila test container (see tests/conftest.py)"]
log_file_level = 10
log_level = 10
log_file = "pytest.log"

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.mypy]
# Stub packages are declared in the 'types' group rather than installed by mypy:
# 'install_types' shells out to pip, which a uv-created venv does not have, and it
# prompts on stdin unless 'non_interactive' is also set.
check_untyped_defs = true
always_true = ["ID_TRANSLATION_PANDAS_IS_TYPED"]

[build-system]
requires = ["uv_build>=0.10.9,<0.12.0"]
build-backend = "uv_build"
